name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BUILD_DIR: dist
  NODE_VERSION: '22'
  GTFS_DEST: public/data/walbrzych-gtfs.zip
  GTFS_FALLBACK: data/fallback/walbrzych-gtfs.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # UWAGA: bez `cache: npm` – repo może nie mieć lockfile'a,
      # a setup-node wywala się wtedy jeszcze przed instalacją.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile znaleziony – npm ci"
            npm ci
          else
            echo "::warning title=npm::Brak package-lock.json – generuję w locie (buildy nie są w pełni powtarzalne)"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
          fi

      - name: Probe GTFS endpoints
        continue-on-error: true
        run: |
          set +e
          for u in \
            "https://gtfs.walbrzych.eu/" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            "https://gtfs.walbrzych.eu/GTFS/SW/GTFS" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip" \
            "http://gtfs.walbrzych.eu/GTFS/ST/GTFS"
          do
            printf '%-50s ' "$u"
            curl -sk -o /dev/null -L -A "Mozilla/5.0" \
                 --connect-timeout 10 --max-time 60 \
                 -w '%{http_code} %{content_type} %{size_download}B\n' "$u" \
              || echo "CONNECTION FAILED"
          done

      - name: Download GTFS
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$GTFS_DEST")"
          tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
          ok=0

          # gtfs.walbrzych.eu ma certyfikat niepasujący do hostname (curl 60),
          # dlatego -k. Integralność weryfikujemy przez unzip -t i kontrolę plików.
          urls="
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            https://gtfs.walbrzych.eu/GTFS/SW/GTFS
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS
          "

          for url in $urls; do
            echo "::group::Próba: $url"
            if curl -fkL \
                 --retry 3 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 15 --max-time 300 \
                 -A "Mozilla/5.0 (GitHub Actions; Mapa2)" \
                 "$url" -o "$tmp" \
               && unzip -tq "$tmp" \
               && unzip -l "$tmp" | grep -qE '[[:space:]]stops\.txt$' \
               && unzip -l "$tmp" | grep -qE '[[:space:]]routes\.txt$'
            then
              cp "$tmp" "$GTFS_DEST"
              echo "✅ Pobrano z: $url"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "❌ Nieudane: $url"
            rm -f "$tmp"; tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
            echo "::endgroup::"
          done

          if [ "$ok" -ne 1 ]; then
            if [ -f "$GTFS_FALLBACK" ] && unzip -tq "$GTFS_FALLBACK"; then
              echo "::warning title=GTFS::Źródła niedostępne – używam snapshotu z repo"
              cp "$GTFS_FALLBACK" "$GTFS_DEST"
            else
              echo "::error title=GTFS::Brak danych i brak snapshotu w $GTFS_FALLBACK"
              exit 1
            fi
          fi

          unzip -l "$GTFS_DEST"
          ls -lh "$GTFS_DEST"

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build --if-present
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          set -euo pipefail
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error title=Build::Katalog '$BUILD_DIR' nie istnieje. Sprawdź BUILD_DIR i skrypt build."
            ls -la
            exit 1
          fi
          ls -la "$BUILD_DIR"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: SPA fallback + .nojekyll
        run: |
          if [ -f "$BUILD_DIR/index.html" ] && [ ! -f "$BUILD_DIR/404.html" ]; then
            cp "$BUILD_DIR/index.html" "$BUILD_DIR/404.html"
          fi
          touch "$BUILD_DIR/.nojekyll"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4