name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Codzienne odświeżenie GTFS o 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_DIR: dist
  NODE_VERSION: "22"
  GTFS_DEST: public/data/walbrzych-gtfs.zip
  GTFS_FALLBACK: data/fallback/walbrzych-gtfs.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bez "cache: npm" - w repo nie ma package-lock.json,
          # z cache ten krok pada błędem "Dependencies lock file is not found".

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile znaleziony – npm ci"
            npm ci
          else
            echo "::warning title=npm::Brak package-lock.json – generuję w locie (buildy nie są w pełni powtarzalne)"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
          fi

      - name: Diagnostyka GTFS
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for u in \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            "https://gtfs.walbrzych.eu/"
          do
            printf '%-50s ' "$u"
            curl -sk -o /dev/null -L -A "Mozilla/5.0" \
                 --connect-timeout 10 --max-time 60 \
                 -w '%{http_code} %{content_type} %{size_download}B\n' "$u" \
              || echo "CONNECTION FAILED"
          done

      - name: Pobierz GTFS Wałbrzych
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$GTFS_DEST")"
          tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
          ok=0

          valid_gtfs() {
            local file="$1"
            [ -f "$file" ] || return 1
            unzip -tq "$file" > /dev/null 2>&1 || return 1
            unzip -l "$file" > /tmp/gtfs-list.txt 2>/dev/null || return 1
            grep -qE '[[:space:]]stops\.txt$' /tmp/gtfs-list.txt || return 1
            grep -qE '[[:space:]]routes\.txt$' /tmp/gtfs-list.txt || return 1
            return 0
          }

          # gtfs.walbrzych.eu ma certyfikat niepasujący do hostname (curl 60),
          # dlatego -k tylko dla tej domeny. Integralność sprawdzamy unzipem.
          # PIERWSZY adres to potwierdzony w logu: 200, application/zip, 2,7 MB.
          urls="
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS
            https://drytcha.github.io/Mapa2/data/walbrzych-gtfs.zip
          "

          for url in $urls; do
            echo "::group::Próba: $url"
            ARGS=(-fL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 300 -A "Mozilla/5.0 (GitHub Actions; Mapa2)")
            if [[ "$url" == *"gtfs.walbrzych.eu"* ]]; then
              ARGS+=(-k)
            fi
            if curl "${ARGS[@]}" "$url" -o "$tmp" && valid_gtfs "$tmp"; then
              cp "$tmp" "$GTFS_DEST"
              echo "✅ Pobrano z: $url"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "❌ Nieudane: $url"
            rm -f "$tmp"; tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
            echo "::endgroup::"
          done

          if [ "$ok" -ne 1 ]; then
            if valid_gtfs "$GTFS_FALLBACK"; then
              echo "::warning title=GTFS::Źródła niedostępne – używam snapshotu z repo"
              cp "$GTFS_FALLBACK" "$GTFS_DEST"
            else
              echo "::error title=GTFS::Brak danych i brak snapshotu w $GTFS_FALLBACK"
              exit 1
            fi
          fi

          chmod 644 "$GTFS_DEST"
          unzip -l "$GTFS_DEST"
          ls -lh "$GTFS_DEST"

      # UWAGA: celowo NIE ma tu kroku Lint.
      # Lint ma 37 błędów react-hooks/* i nie może blokować publikacji strony.
      # Uruchamiaj go lokalnie: npm run lint

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Wykryj katalog builda
        id: build-output
        shell: bash
        run: |
          found=""
          for d in "$BUILD_DIR" out dist build; do
            if [ -f "$d/index.html" ]; then
              found="$d"
              break
            fi
          done
          if [ -z "$found" ]; then
            for d in "$BUILD_DIR" out dist build; do
              if [ -d "$d" ]; then
                found="$d"
                break
              fi
            done
          fi
          if [ -z "$found" ]; then
            echo "::error::Nie znaleziono katalogu z buildem (dist/out/build)"
            ls -la
            exit 1
          fi
          echo "Publikuję katalog: $found"
          echo "path=./$found" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-output.outputs.path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4