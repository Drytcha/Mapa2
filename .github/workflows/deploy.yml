name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Codzienne odświeżenie GTFS o 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_DIR: dist
  NODE_VERSION: 22
  GTFS_DEST: src/assets/walbrzych-gtfs.zip
  GTFS_FALLBACK: data/fallback/walbrzych-gtfs.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json', 'package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile znaleziony – npm ci"
            npm ci
          else
            echo "::warning title=npm::Brak package-lock.json – generuję w locie (buildy nie są w pełni powtarzalne)"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
          fi

      - name: Diagnostyka GTFS
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for u in \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS%20(full).zip" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            "https://gtfs.walbrzych.eu/"
          do
            printf '%-50s ' "$u"
            curl -sk -o /dev/null -L -A "Mozilla/5.0" \
                 --connect-timeout 10 --max-time 60 \
                 -w '%{http_code} %{content_type} %{size_download}B\n' "$u" \
              || echo "CONNECTION FAILED"
          done

      - name: Pobierz GTFS Wałbrzych
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$GTFS_DEST")"
          tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
          ok=0

          valid_gtfs() {
            local file="$1"
            [ -f "$file" ] || return 1
            unzip -tq "$file" > /dev/null 2>&1 || return 1
            unzip -l "$file" > /tmp/gtfs-list.txt 2>/dev/null || return 1
            grep -qE '[[:space:]]stops\.txt$' /tmp/gtfs-list.txt || return 1
            grep -qE '[[:space:]]routes\.txt$' /tmp/gtfs-list.txt || return 1
            return 0
          }

          # gtfs.walbrzych.eu ma certyfikat niepasujący do hostname (curl 60),
          # dlatego -k tylko dla tej domeny. Integralność sprawdzamy unzipem.
          # WAŻNE: aplikacja potrzebuje paczki "GTFS (full).zip" — publiczny
          # "GTFS.zip" NIE zawiera linii 30 (brygady 30/01 i 30/02 od 1 grudnia)
          # ani linii planistycznych S1-S4. "full" musi być PIERWSZY na liście;
          # zwykły GTFS.zip to tylko awaryjny zapas (z ostrzeżeniem).
          urls="
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS%20(full).zip
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS%20(full).zip
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS
          "
          used_url=""

          for url in $urls; do
            echo "::group::Próba: $url"
            ARGS=(-fL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 300 -A "Mozilla/5.0 (GitHub Actions; Mapa2)")
            if [[ "$url" == *"gtfs.walbrzych.eu"* ]]; then
              ARGS+=(-k)
            fi
            if curl "${ARGS[@]}" "$url" -o "$tmp" && valid_gtfs "$tmp"; then
              cp "$tmp" "$GTFS_DEST"
              echo "✅ Pobrano z: $url"
              used_url="$url"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "❌ Nieudane: $url"
            rm -f "$tmp"; tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
            echo "::endgroup::"
          done

          if [ "$ok" -ne 1 ]; then
            if valid_gtfs "$GTFS_FALLBACK"; then
              echo "::warning title=GTFS::Źródła niedostępne – używam snapshotu z repo"
              cp "$GTFS_FALLBACK" "$GTFS_DEST"
            else
              echo "::error title=GTFS::Brak danych i brak snapshotu w $GTFS_FALLBACK"
              exit 1
            fi
          fi

          chmod 644 "$GTFS_DEST"
          unzip -l "$GTFS_DEST"
          ls -lh "$GTFS_DEST"

          if [ -n "$used_url" ] && [[ "$used_url" != *"(full)"* ]]; then
            echo "::warning title=GTFS::Użyto zwykłego GTFS bez wariantu (full): brak linii 30 i S1-S4"
          fi

          # Kontrola kompletności: czy brygady linii 30 (30/01, 30/02) są w paczce,
          # gdy feed obejmuje 1 grudnia 2026 lub później.
          feed_end="$(unzip -p "$GTFS_DEST" feed_info.txt 2>/dev/null | tr -d '\r' | awk -F, 'NR==2{print $5}')"
          blocks_30="$(unzip -p "$GTFS_DEST" trips.txt | tr -d '\r' | grep -cE '(^|,)"?30/0[0-9]"?(,|$)' || true)"
          echo "feed_end_date=${feed_end:-?}  kursy brygad 30/0x w paczce: ${blocks_30}"
          if [ "${feed_end:-0}" -ge 20261201 ] 2>/dev/null && [ "${blocks_30}" -eq 0 ]; then
            echo "::error title=GTFS::Feed obejmuje grudzień, ale brak brygad 30/01 i 30/02 (linia 30). Pobrano niepełną paczkę."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Vite: build produkcyjny. NEXT_PUBLIC_* zostawione dla zgodności, jeżeli
      # vite.config.ts czyta base z tych zmiennych. Jeśli nie – są nieszkodliwe.
      - name: Build (Vite)
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: "/Mapa2"
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Sprawdź wynik builda
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "::error::Brak $BUILD_DIR/index.html po buildzie - eksport statyczny się nie udał"
            ls -la
            ls -la "$BUILD_DIR" 2>/dev/null || echo "Brak katalogu $BUILD_DIR"
            exit 1
          fi

          echo "Pliki w $BUILD_DIR (max 2 poziomy):"
          find "$BUILD_DIR" -maxdepth 2 -type f | sort | head -n 100

          # Vite z pluginem singlefile wrzuca cały bundle + GTFS do index.html,
          # więc nie ma osobnego dist/data/walbrzych-gtfs.zip - nie kopiujemy go.
          # .nojekyll zostawione na wypadek assetów z podkreśleniem w nazwie.
          touch "$BUILD_DIR/.nojekyll"

          echo "Rozmiar $BUILD_DIR/index.html:"
          ls -lh "$BUILD_DIR/index.html"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4