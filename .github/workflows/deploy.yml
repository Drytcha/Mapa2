name: Build MapPlaner and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate route types and typecheck
        run: |
          npx next typegen
          npm exec tsc -- --noEmit --pretty false
      - name: Verify server build without database credentials
        run: npm run build
        env:
          DATABASE_URL: ""
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build static traveler and planner app
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DATABASE_URL: ""
        run: |
          npm run build
          test -s out/index.html
          test ! -d out/api
          touch out/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
