name: Build MapPlaner and deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `cache: npm` makes actions/setup-node look for a lockfile. Checking for it
      # first keeps CI working whether or not package-lock.json is committed yet.
      - name: Detect dependency lockfile
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
            echo "Using the committed package-lock.json (reproducible npm ci)."
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package-lock.json is not committed. CI will resolve one from package.json; commit it to pin dependency versions."
          fi

      - name: Setup Node.js 22 with npm cache
        if: ${{ steps.lockfile.outputs.cached == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Node.js 22
        if: ${{ steps.lockfile.outputs.cached != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Generated only when the lockfile is missing, so `npm ci` can always run.
      # `npm ci` also fails loudly when package.json and the lockfile disagree.
      - name: Resolve lockfile when it is missing
        if: ${{ steps.lockfile.outputs.cached != 'true' }}
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Show installed toolchain
        run: |
          node --version
          npm --version

      - name: Generate route types and typecheck
        run: |
          npx next typegen
          npm exec tsc -- --noEmit --pretty false

      - name: Verify server build without database credentials
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static traveler and planner app
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DATABASE_URL: ""
        run: |
          npm run build
          test -s out/index.html
          test ! -d out/api
          test -s out/data/walbrzych-gtfs.zip
          touch out/.nojekyll

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
