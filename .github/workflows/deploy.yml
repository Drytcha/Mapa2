
      - name: Build static traveler and planner app
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DATABASE_URL: ""
        run: |
          npm run build

          echo "=== Sprawdzanie wygenerowanych plików ==="

          if [ ! -s out/index.html ]; then
            echo "::error::Brak out/index.html"
            exit 1
          fi

          if [ -d out/api ]; then
            echo "::error::Folder out/api nie powinien istnieć"
            find out/api -maxdepth 3 -type f
            exit 1
          fi

          if [ ! -s out/data/walbrzych-gtfs.zip ]; then
            echo "::error::Brak pliku out/data/walbrzych-gtfs.zip"
            echo "Zawartość out:"
            find out -maxdepth 4 -type f | head -100
            echo "Zawartość public:"
            find public -maxdepth 4 -type f | head -100
            exit 1
          fi

          touch out/.nojekyll
          echo "=== Wszystkie kontrole zakończone poprawnie ==="
