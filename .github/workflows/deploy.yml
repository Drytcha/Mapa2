name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Codzienne odświeżenie GTFS o 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_DIR: dist
  NODE_VERSION: "22"
  GTFS_DEST: public/data/walbrzych-gtfs.zip
  GTFS_FALLBACK: data/fallback/walbrzych-gtfs.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bez "cache: npm" - w repo nie ma package-lock.json,
          # z cache ten krok pada błędem "Dependencies lock file is not found".

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile znaleziony – npm ci"
            npm ci
          else
            echo "::warning title=npm::Brak package-lock.json – generuję w locie (buildy nie są w pełni powtarzalne)"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
          fi

      - name: Diagnostyka GTFS
        shell: bash
        run: |
          set +e
          for u in \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            "https://gtfs.walbrzych.eu/"
          do
            printf '%-50s ' "$u"
            curl -sk -o /dev/null -L -A "Mozilla/5.0" \
                 --connect-timeout 10 --max-time 60 \
                 -w '%{http_code} %{content_type} %{size_download}B\n' "$u" \
              || echo "CONNECTION FAILED"
          done

      - name: Pobierz GTFS Wałbrzych
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$GTFS_DEST")"
          tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
          ok=0

          # gtfs.walbrzych.eu ma certyfikat niepasujący do hostname (curl 60),
          # dlatego -k. Integralność weryfikujemy przez unzip -t i kontrolę plików.
          # PIERWSZY adres to ten potwierdzony w logu jako działający (200, zip, 2,7 MB).
          # Bez --retry-all-errors: 404 nie jest ponawiany, od razu leci następny adres.
          urls="
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS
            https://gtfs.walbrzych.eu/GTFS/SW/GTFS
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS
            https://drytcha.github.io/Mapa2/data/walbrzych-gtfs.zip
          "

          for url in $urls; do
            echo "::group::Próba: $url"
            if curl -fkL \
                 --retry 3 --retry-delay 5 \
                 --connect-timeout 15 --max-time 300 \
                 -A "Mozilla/5.0 (GitHub Actions; Mapa2)" \
                 "$url" -o "$tmp" \
               && unzip -tq "$tmp" \
               && unzip -l "$tmp" | grep -qE '[[:space:]]stops\.txt$' \
               && unzip -l "$tmp" | grep -qE '[[:space:]]routes\.txt$'
            then
              cp "$tmp" "$GTFS_DEST"
              echo "✅ Pobrano z: $url"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "❌ Nieudane: $url"
            rm -f "$tmp"; tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
            echo "::endgroup::"
          done

          if [ "$ok" -ne 1 ]; then
            if [ -f "$GTFS_FALLBACK" ] && unzip -tq "$GTFS_FALLBACK"; then
              echo "::warning title=GTFS::Źródła niedostępne – używam snapshotu z repo"
              cp "$GTFS_FALLBACK" "$GTFS_DEST"
            else
              echo "::error title=GTFS::Brak danych i brak snapshotu w $GTFS_FALLBACK"
              exit 1
            fi
          fi

          unzip -l "$GTFS_DEST"
          ls -lh "$GTFS_DEST"

      # Lint NIE blokuje deploya. 37 błędów react-hooks/* w komponentach
      # trzeba docelowo naprawić w kodzie albo złagodzić w eslint.config,
      # ale nie mogą wywracać publikacji strony. Błędy nadal widać w logu.
      - name: Lint (nieblokujący)
        continue-on-error: true
        run: npm run lint --if-present

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Wykryj katalog builda
        id: build-output
        shell: bash
        run: |
          if [ -d "$BUILD_DIR" ]; then
            echo "path=./$BUILD_DIR" >> "$GITHUB_OUTPUT"
          elif [ -d out ]; then
            echo "path=./out" >> "$GITHUB_OUTPUT"
          elif [ -d dist ]; then
            echo "path=./dist" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "path=./build" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Nie znaleziono katalogu dist, out ani build po buildzie"
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-output.outputs.path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4