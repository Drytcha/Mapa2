name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Codzienne odświeżenie danych GTFS o 03:17 UTC, nawet bez commita
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sprawdź package-lock.json
        id: lockfile
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Uzupełnij package-lock.json (jeśli brakuje)
        if: steps.lockfile.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Pobierz GTFS Wałbrzych
        shell: bash
        run: |
          mkdir -p public/data
          DEST="public/data/walbrzych-gtfs.zip"
          TMP="/tmp/walbrzych-gtfs.zip"
          rm -f "$TMP"

          # Kolejno: prawdopodobny nowy adres, stary adres z loga,
          # a na końcu ostatnia działająca kopia z Twojej opublikowanej strony
          URLS=(
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip"
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS"
            "https://gtfs.walbrzych.eu/GTFS/GTFS.zip"
            "https://drytcha.github.io/Mapa2/data/walbrzych-gtfs.zip"
          )

          success=0
          for url in "${URLS[@]}"; do
            echo "==> Próba pobrania: $url"
            if curl -fL \
                  --retry 3 \
                  --retry-delay 5 \
                  --connect-timeout 15 \
                  --max-time 180 \
                  -A "Mapa2-GitHub-Actions" \
                  "$url" -o "$TMP" \
               && unzip -t "$TMP" > /dev/null \
               && unzip -l "$TMP" | grep -q "stops.txt" \
               && unzip -l "$TMP" | grep -q "routes.txt"; then
              cp "$TMP" "$DEST"
              success=1
              echo "Pobrano poprawny GTFS z: $url"
              break
            fi
            echo "::warning::Niedostępny lub nieprawidłowy plik: $url"
            rm -f "$TMP"
          done

          if [ "$success" -ne 1 ]; then
            if [ -f "$DEST" ] && unzip -t "$DEST" > /dev/null; then
              echo "::warning::Używam pliku GTFS znajdującego się w repozytorium."
            else
              echo "::error::Nie udało się pobrać GTFS z żadnego źródła."
              exit 1
            fi
          fi

          ls -lh "$DEST"
          unzip -l "$DEST"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build

      - name: Wykryj katalog builda
        id: build-output
        shell: bash
        run: |
          if [ -d dist ]; then
            echo "path=./dist" >> "$GITHUB_OUTPUT"
          elif [ -d out ]; then
            echo "path=./out" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "path=./build" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Nie znaleziono katalogu dist, out ani build po buildzie"
            ls -la
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build-output.outputs.path }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4