
name: Build MapPlaner and deploy to Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect package lock
        id: lock
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package lock if missing
        if: steps.lock.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Download latest Wałbrzych GTFS
        shell: bash
        run: |
          mkdir -p public/data

          curl --fail --location \
            --retry 3 \
            --retry-delay 5 \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            -o public/data/walbrzych-gtfs.zip

          if ! unzip -t public/data/walbrzych-gtfs.zip; then
            echo "ERROR: Downloaded GTFS archive is invalid"
            exit 1
          fi

          echo "GTFS downloaded successfully:"
          ls -lh public/data/walbrzych-gtfs.zip

      - name: Generate Next.js types
        run: npx next typegen

      - name: Check TypeScript
        run: npm exec tsc -- --noEmit --pretty false

      - name: Verify server build without database credentials
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static traveler and planner app
        run: npm run build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          DATABASE_URL: ""

      - name: Verify static export
        shell: bash
        run: |
          if [ ! -s out/index.html ]; then
            echo "ERROR: Missing out/index.html"
            exit 1
          fi

          if [ -d out/api ]; then
            echo "ERROR: API directory should not exist in static export"
            exit 1
          fi

          if [ ! -s out/data/walbrzych-gtfs.zip ]; then
            echo "ERROR: Missing out/data/walbrzych-gtfs.zip"
            echo "Contents of out:"
            find out -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Static export verified successfully."

          touch out/.nojekyll

          echo "Output directory:"
          ls -lah out

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
