name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Codzienne odświeżenie GTFS o 03:17 UTC
    - cron: "17 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  BUILD_DIR: out
  NODE_VERSION: "22"
  GTFS_DEST: public/data/walbrzych-gtfs.zip
  GTFS_FALLBACK: data/fallback/walbrzych-gtfs.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Bez "cache: npm" - w repo nie ma package-lock.json,
          # z cache ten krok pada błędem "Dependencies lock file is not found".

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Lockfile znaleziony – npm ci"
            npm ci
          else
            echo "::warning title=npm::Brak package-lock.json – generuję w locie (buildy nie są w pełni powtarzalne)"
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
            npm ci
          fi

      - name: Diagnostyka GTFS
        continue-on-error: true
        shell: bash
        run: |
          set +e
          for u in \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip" \
            "https://gtfs.walbrzych.eu/GTFS/ST/GTFS" \
            "https://gtfs.walbrzych.eu/"
          do
            printf '%-50s ' "$u"
            curl -sk -o /dev/null -L -A "Mozilla/5.0" \
                 --connect-timeout 10 --max-time 60 \
                 -w '%{http_code} %{content_type} %{size_download}B\n' "$u" \
              || echo "CONNECTION FAILED"
          done

      - name: Pobierz GTFS Wałbrzych
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$(dirname "$GTFS_DEST")"
          tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
          ok=0

          valid_gtfs() {
            local file="$1"
            [ -f "$file" ] || return 1
            unzip -tq "$file" > /dev/null 2>&1 || return 1
            unzip -l "$file" > /tmp/gtfs-list.txt 2>/dev/null || return 1
            grep -qE '[[:space:]]stops\.txt$' /tmp/gtfs-list.txt || return 1
            grep -qE '[[:space:]]routes\.txt$' /tmp/gtfs-list.txt || return 1
            return 0
          }

          # gtfs.walbrzych.eu ma certyfikat niepasujący do hostname (curl 60),
          # dlatego -k tylko dla tej domeny. Integralność sprawdzamy unzipem.
          # PIERWSZY adres to potwierdzony w logu: 200, application/zip, 2,7 MB.
          urls="
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            http://gtfs.walbrzych.eu/GTFS/ST/GTFS.zip
            https://gtfs.walbrzych.eu/GTFS/ST/GTFS
            https://drytcha.github.io/Mapa2/data/walbrzych-gtfs.zip
          "

          for url in $urls; do
            echo "::group::Próba: $url"
            ARGS=(-fL --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 300 -A "Mozilla/5.0 (GitHub Actions; Mapa2)")
            if [[ "$url" == *"gtfs.walbrzych.eu"* ]]; then
              ARGS+=(-k)
            fi
            if curl "${ARGS[@]}" "$url" -o "$tmp" && valid_gtfs "$tmp"; then
              cp "$tmp" "$GTFS_DEST"
              echo "✅ Pobrano z: $url"
              ok=1
              echo "::endgroup::"
              break
            fi
            echo "❌ Nieudane: $url"
            rm -f "$tmp"; tmp="$(mktemp /tmp/gtfs.XXXXXX.zip)"
            echo "::endgroup::"
          done

          if [ "$ok" -ne 1 ]; then
            if valid_gtfs "$GTFS_FALLBACK"; then
              echo "::warning title=GTFS::Źródła niedostępne – używam snapshotu z repo"
              cp "$GTFS_FALLBACK" "$GTFS_DEST"
            else
              echo "::error title=GTFS::Brak danych i brak snapshotu w $GTFS_FALLBACK"
              exit 1
            fi
          fi

          chmod 644 "$GTFS_DEST"
          unzip -l "$GTFS_DEST"
          ls -lh "$GTFS_DEST"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # KLUCZOWA ZMIANA: zwykły "next build" tworzy tylko .next,
      # a GitHub Pages potrzebuje statycznego katalogu out z index.html.
      # Ten krok (TYLKO na runnerze, repo bez zmian):
      #  1) odsuwa src/app/api - tras API nie da się wyeksportować statycznie,
      #  2) dopisuje output:"export", basePath:"/Mapa2" itd. do next.config.*
      - name: Przygotuj Next.js do GitHub Pages (eksport statyczny)
        shell: bash
        run: |
          set -euo pipefail

          if [ -d src/app/api ]; then
            echo "::warning title=Next.js::Odsuwam src/app/api na czas eksportu statycznego (Pages nie obsługuje tras API)"
            rm -rf /tmp/next-api-backup
            mv src/app/api /tmp/next-api-backup
            find /tmp/next-api-backup -type f | sort
          fi

          cat > /tmp/patch-next-pages.mjs <<'EOF'
          import fs from "node:fs";

          const candidates = ["next.config.ts", "next.config.mjs", "next.config.js", "next.config.cjs"];
          const file = candidates.find((f) => fs.existsSync(f));

          if (!file) {
            fs.writeFileSync(
              "next.config.mjs",
              'export default { output: "export", trailingSlash: true, images: { unoptimized: true }, basePath: "/Mapa2" };\n'
            );
            console.log("Utworzono nowy next.config.mjs pod GitHub Pages");
            process.exit(0);
          }

          let code = fs.readFileSync(file, "utf8");
          console.log(`--- ${file} (oryginał) ---`);
          console.log(code);

          const additions = [];

          if (/output\s*:/.test(code)) {
            code = code.replace(/output\s*:\s*[^,\n}]+/, 'output: "export"');
            console.log('Wymuszono output: "export"');
          } else {
            additions.push('output: "export"');
          }
          if (!/trailingSlash\s*:/.test(code)) additions.push("trailingSlash: true");
          if (!/images\s*:/.test(code)) additions.push("images: { unoptimized: true }");
          if (!/basePath\s*:/.test(code)) additions.push('basePath: "/Mapa2"');

          if (additions.length > 0) {
            const patterns = [/=\s*\{/, /export\s+default\s*\{/, /return\s*\{/];
            let idx = -1;
            let len = 0;
            for (const p of patterns) {
              const m = code.match(p);
              if (m) { idx = m.index; len = m[0].length; break; }
            }
            if (idx === -1) {
              console.error(`::error::Nie udało się dopisać ustawień Pages do ${file}. Dopisz ręcznie w obiekcie configu: ${additions.join(", ")}`);
              process.exit(1);
            }
            const at = idx + len;
            code = code.slice(0, at) + "\n    " + additions.join(",\n    ") + "," + code.slice(at);
          }

          fs.writeFileSync(file, code);
          console.log(`--- ${file} (po zmianie pod GitHub Pages) ---`);
          console.log(fs.readFileSync(file, "utf8"));
          EOF

          node /tmp/patch-next-pages.mjs

      - name: Build
        env:
          GITHUB_PAGES: "true"
        run: npm run build

      - name: Sprawdź wynik builda
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f out/index.html ]; then
            echo "::error::Brak out/index.html po buildzie - eksport statyczny się nie udał"
            ls -la
            ls -la out 2>/dev/null || echo "Brak katalogu out"
            exit 1
          fi
          echo "Pliki w out (max 2 poziomy):"
          find out -maxdepth 2 -type f | sort | head -n 100

          # Next przy eksporcie kopiuje public/ do out/, ale dla pewności:
          if [ -f public/data/walbrzych-gtfs.zip ] && [ ! -f out/data/walbrzych-gtfs.zip ]; then
            mkdir -p out/data
            cp public/data/walbrzych-gtfs.zip out/data/walbrzych-gtfs.zip
          fi
          ls -lh out/data/walbrzych-gtfs.zip || echo "::warning::Brak GTFS w out/data"

          # Żeby Pages serwował katalogi z podkreśleniem (_next)
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4