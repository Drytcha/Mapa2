<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapPlaner — planer tras, kursówki Wałbrzych i PDF</title>
    <meta
      name="description"
      content="MapPlaner — planer tras autobusowych z kursówkami Wałbrzych GTFS, sygnalizacją świetlną, korkami oraz pozycjami GPS autobusów MZUK i ŚKA."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("mapplaner.theme");
        document.documentElement.classList.toggle("dark", t !== "light");
        document.documentElement.style.colorScheme = t === "light" ? "light" : "dark";
      } catch (e) {}
    </script>
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
